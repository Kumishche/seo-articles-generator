# Запуск всей системы: docker compose up --build
# Перед запуском скопируйте .env.example в .env и укажите OPENAI_API_KEY.
name: seo-article-ai

services:
  backend:
    build: ./back
    env_file:
      - path: .env
        required: false
    ports:
      # Swagger UI: http://localhost:8080/swagger-ui.html
      - "8080:8080"
    healthcheck:
      # В образе JRE нет curl: проверяем, что порт принимает соединения
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./front
      args:
        BACKEND_URL: http://backend:8080
        NEXT_PUBLIC_SITE_DOMAIN: ${SITE_DOMAIN:-example.ru}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
